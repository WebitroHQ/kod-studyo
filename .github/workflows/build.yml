# Kod Stüdyo masaüstü paketleri: Windows (NSIS kurulum) ve macOS (dmg + zip, Apple Silicon + Intel).
# macOS paketi yalnızca macOS üzerinde derlenebildiği için GitHub Actions'ta üretilir.
# Elle çalıştır: Actions → build → Run workflow. "v*" etiketi itilince de çalışır ve sürüm taslağına ekler.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kod-studyo-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
