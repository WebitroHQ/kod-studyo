# Desktop builds: Windows (NSIS installer) and macOS (dmg + zip, Apple Silicon + Intel).
# macOS builds only run on macOS, so they are produced here on GitHub Actions.
# Run manually (Actions → build → Run workflow) to get artifacts, or push a "v*" tag to publish a release
# that scripts/install.ps1 and scripts/install.sh download from.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kod-studyo-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
